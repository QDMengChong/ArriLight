name: iOS build and TestFlight
run-name: iOS ${{ inputs.mode || 'build-check' }} · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build check, signed IPA, or upload to TestFlight
        type: choice
        required: true
        default: build-check
        options:
          - build-check
          - ipa
          - testflight
      version:
        description: App version (for example 0.1.3); empty uses the project version
        type: string
        required: false
      build_number:
        description: Build number override; empty uses (run number + 4).run attempt
        type: string
        required: false
  pull_request:
    paths:
      - ArriLight/**
      - ArriOpto.BLE/**
      - tests/**
      - .github/workflows/ios.yml
      - .github/scripts/ios-*
      - global.json
      - Directory.*
      - NuGet.Config
      - nuget.config

permissions:
  contents: read

# Serialize manual runs so a newer build is not uploaded before an older run.
concurrency:
  group: ios-${{ github.event_name }}-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: '10.0.401'
  DOTNET_WORKLOAD_VERSION: '10.0.401'
  XCODE_VERSION: '26.6'
  PROJECT_PATH: ArriLight/ArriLight.csproj
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  tests:
    name: Tests (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project:
          - ArriLight.Tests
          - ArriLight.Discovery.Tests
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Pin the SDK for this CI checkout
        run: dotnet new globaljson --sdk-version "$DOTNET_VERSION" --roll-forward disable --force
      - name: Run tests
        env:
          TEST_PROJECT: ${{ matrix.project }}
        run: >-
          dotnet test "tests/$TEST_PROJECT/$TEST_PROJECT.csproj"
          --configuration Release
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.project }}-${{ github.run_attempt }}
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14

  ios:
    name: iOS (${{ inputs.mode || 'build-check' }})
    needs: tests
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      MODE: ${{ inputs.mode || 'build-check' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate configuration and resolve app versions
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          echo "SIGNING_DIRECTORY=$RUNNER_TEMP/arrilight-signing" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN_PATH=$RUNNER_TEMP/arrilight-signing.keychain-db" >> "$GITHUB_ENV"
          python3 .github/scripts/ios-configure.py

      - name: Select Xcode
        run: |
          set -euo pipefail
          developer_dir="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          if [[ ! -d "$developer_dir" ]]; then
            echo "::error::Xcode $XCODE_VERSION is missing from this runner image. Update the SDK, workload set, and Xcode pins together."
            exit 1
          fi
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$developer_dir" xcodebuild -version

      - uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install the pinned MAUI iOS workload
        run: |
          set -euo pipefail
          dotnet new globaljson --sdk-version "$DOTNET_VERSION" --roll-forward disable --force
          dotnet workload install maui-ios --version "$DOTNET_WORKLOAD_VERSION"
          dotnet --info
          dotnet workload --info

      - name: Build the iOS simulator app without signing credentials
        if: env.MODE == 'build-check'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios-logs" "$RUNNER_TEMP/ios-artifacts"
          dotnet build "$PROJECT_PATH" \
            -f net10.0-ios -c Debug \
            -p:TargetFrameworks=net10.0-ios \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:EnableCodeSigning=false \
            -p:CodesignRequireProvisioningProfile=false \
            -p:ApplicationId="$IOS_BUNDLE_ID" \
            -p:ApplicationDisplayVersion="$IOS_VERSION" \
            -p:ApplicationVersion="$IOS_BUILD_NUMBER" \
            2>&1 | tee "$RUNNER_TEMP/ios-logs/build.log"
          ditto -c -k --sequesterRsrc --keepParent \
            ArriLight/bin/Debug/net10.0-ios/iossimulator-arm64/ArriLight.app \
            "$RUNNER_TEMP/ios-artifacts/ArriLight-simulator.zip"

      - name: Install and validate the Apple signing material
        if: env.MODE != 'build-check'
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: bash .github/scripts/ios-signing.sh

      - name: Publish a signed iPhone IPA
        if: env.MODE != 'build-check'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios-logs" "$RUNNER_TEMP/ios-artifacts"
          dotnet publish "$PROJECT_PATH" \
            -f net10.0-ios -c Release \
            -p:TargetFrameworks=net10.0-ios \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ArchiveOnBuild=true \
            -p:BuildIpa=true \
            -p:ApplicationId="$IOS_BUNDLE_ID" \
            -p:ApplicationDisplayVersion="$IOS_VERSION" \
            -p:ApplicationVersion="$IOS_BUILD_NUMBER" \
            -p:CodesignKey="$IOS_SIGNING_IDENTITY" \
            -p:CodesignProvision="$IOS_PROFILE_UUID" \
            -p:CodesignKeychain="$SIGNING_KEYCHAIN_PATH" \
            2>&1 | tee "$RUNNER_TEMP/ios-logs/build.log"
          shopt -s nullglob
          ipa_files=(ArriLight/bin/Release/net10.0-ios/ios-arm64/publish/*.ipa)
          if [[ ${#ipa_files[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one IPA in the publish directory."
            exit 1
          fi
          ipa_path="$RUNNER_TEMP/ios-artifacts/ArriLight-${IOS_VERSION}-${IOS_BUILD_NUMBER}.ipa"
          cp "${ipa_files[0]}" "$ipa_path"
          echo "IOS_IPA_PATH=$ipa_path" >> "$GITHUB_ENV"
          dsym_path="ArriLight/bin/Release/net10.0-ios/ios-arm64/ArriLight.app.dSYM"
          if [[ -d "$dsym_path" ]]; then
            ditto -c -k --sequesterRsrc --keepParent "$dsym_path" \
              "$RUNNER_TEMP/ios-artifacts/ArriLight.app.dSYM.zip"
          fi

      # Keep the IPA even when validation or upload to Apple fails later.
      - name: Save the app artifact
        uses: actions/upload-artifact@v7
        with:
          name: ArriLight-ios-${{ env.MODE }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Validate and upload to App Store Connect
        if: env.MODE == 'testflight'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          # altool finds AuthKey_<Key ID>.p8 in ./private_keys.
          cd "$SIGNING_DIRECTORY"
          xcrun altool --validate-app --file "$IOS_IPA_PATH" --type ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --output-format json
          xcrun altool --upload-app --file "$IOS_IPA_PATH" --type ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --output-format json
          echo "Uploaded $IOS_VERSION ($IOS_BUILD_NUMBER) to App Store Connect. Wait for Apple processing, then configure testers in TestFlight." >> "$GITHUB_STEP_SUMMARY"

      - name: Save build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ArriLight-ios-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-logs/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove temporary signing material
        if: always() && env.MODE != 'build-check'
        run: |
          set -euo pipefail
          SIGNING_KEYCHAIN_PATH="${SIGNING_KEYCHAIN_PATH:-$RUNNER_TEMP/arrilight-signing.keychain-db}"
          SIGNING_DIRECTORY="${SIGNING_DIRECTORY:-$RUNNER_TEMP/arrilight-signing}"
          cleanup_status=0
          if [[ -f "$SIGNING_KEYCHAIN_PATH" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH" || cleanup_status=$?
          fi
          if [[ -n "${IOS_PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${IOS_PROFILE_UUID}.mobileprovision"
          fi
          rm -rf "$SIGNING_DIRECTORY"
          exit "$cleanup_status"
